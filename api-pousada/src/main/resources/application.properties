# perfil padrao (pode ser sobrescrito por variavel de ambiente)
spring.profiles.active=dev

# Chave de assinatura do JWT: defina a variavel de ambiente JWT_SECRET (minimo 64 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.exp=86400

spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leakDetectionThreshold=20000

spring.mvc.async.request-timeout=-1

APP_ENV=dev

logging.level.br.com.pousda.pousada.notificacoes=DEBUG
logging.level.br.com.pousda.pousada.usuarios=DEBUG
